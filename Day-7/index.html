<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style/index.css">
    <link rel="stylesheet" href="../assets/fontawesome-free-7.3.1-web/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="wrapper">
                <div class="head-text">
                    <h2 class="title">My task</h2>
                    <p class="sub-title">Create a new task!</p>
                </div>
                <header class="header">
                    <div class="search-section">
                        <input type="text" id="find-task" class="todo-search" placeholder="Find a task">
                        <!-- <button class="search-btn">Find</button> -->
                        <div class="todo-btns">
                            <button class="todo-btn" id="pending-task">Pending</button>
                            <button class="todo-btn" id="completed-task">Completed</button>
                        </div>
                    </div>
                    <button class="todo-addBtn" id="open-modal">
                        Add Tasks <i class="fa-solid fa-plus"></i>
                    </button>
                    <!-- add modal -->
                     <dialog class="add-modal" id="modal-main">
                        <div class="modal-head">
                            <h4 class="modal-title">New tasks</h4>
                            <span id="close-modal"><i class="fa-solid fa-xmark"></i></span>
                        </div>
                        <input type="text" class="modal-input" id="modal-title" placeholder="Task title..">
                        <textarea type="text" class="modal-input" id="modal-subTitle" placeholder="Task desc..." ></textarea>
                        <select name="" id="select-task" class="select-progress">
                            <option value="High" class="select-option">High</option>
                            <option value="Low" class="select-option">Low</option>
                        </select>
                        <div class="modal-btns">
                            <button class="cancel-btn" id="cancel-btn">Cancel</button>
                            <button class="task-btn" id="create-task" onclick="renderTasks()">Create Task</button>
                        </div>
                     </dialog>
                </header>
                <div class="todo-container">
                    <div class="card-header">
                        <h3 class="todo-title">Tasks</h3>
                        <button class="clear-all all-clear">Clear All</button>
                    </div>
                    <div class="allCards" id="all-cards">
                        <!-- <div class="todo-card">
                            <h3 class="card-title" id="card-title"></h3>
                            <p class="card-subTitle" id="card-subTitle"></p>
                            <div class="card-btns">
                                <span class="card-progress" id="card-progress"></span>
                                <div class="">
                                    <button class="edit-btn">Edit</button>
                                    <button class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
        <!-- final meassage -->
         <div id="toast-container"></div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
