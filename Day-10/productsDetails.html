<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/fontawesome-free-7.3.1-web/css/all.min.css">
    <link rel="stylesheet" href="./style/productDetails.css">
</head>
<body>
    <main class="">
        <section class="navbar">
            <div class="container">
                <div class="navbar-wrapper">
                    <a href="./index.html" class="logo"><i class="fa-solid fa-cart-shopping"></i> ShopEase</a>
                    <div class="search">
                        <!-- <input type="text" placeholder="Search products....." class="search-input"> -->
                        <div class="cart-icons">
                            <a href="#" class=""><i class="fa-solid fa-heart"></i></a>
                            <a href="./addToCart.html" class="cart-head">
                                <i class="fa-solid fa-cart-shopping"></i>
                                <span id="total-cart">0</span>
                            </a>
                            <a href="#" class=""><i class="fa-solid fa-user"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="product-details">
            <div class="container">
                <div class="details-wrapper">
                    <a href="./index.html" class="back-btn"><i class="fa-solid fa-arrow-left-long"></i> Back to products</a>
                    <div class="products-infos" id="details-product">

                    </div>
                </div>
            </div>
        </section>
        <section class="services">
            <div class="container">
                <div class="services-wrapper">
                    <div class="service">
                        <span class="service-icon"><i class="fa-solid fa-truck"></i></span>
                        <div class="">
                            <h4 class="service-title">Free shipping</h4>
                            <p class="service-subTitle">On orders over 560</p>
                        </div>
                    </div>
                    <div class="service">
                        <span class="service-icon"><i class="fa-solid fa-arrows-rotate"></i></span>
                        <div class="">
                            <h4 class="service-title">Easy returns</h4>
                            <p class="service-subTitle">7day returns policy</p>
                        </div>
                    </div>
                    <div class="service">
                        <span class="service-icon"><i class="fa-solid fa-credit-card"></i></span>
                        <div class="">
                            <h4 class="service-title">Secure payment</h4>
                            <p class="service-subTitle">100% secure payment</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="details">
            <div class="container">
                <div class="pr-wrapper" id="pr-details">

                </div>
            </div>
        </section>
    </main>

    <script type="module" src="./details.js"></script>
</body>
</html>
